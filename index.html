<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labyr</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="labyr1.js" defer></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    #grid {
      padding: 10px;
      display: grid;
      /* grid-template-columns: repeat(2, auto); */
      align-items: center;
      gap: 0;
    }

    .node {
      margin: 0px;
      padding: 0px;
      width: 100px;
      height: 100px;
      border: solid 10px black;

    }

    .destination {
      background: red;
      color: white;
    }


    .start {
      background: green;
      color: white;
    }

    .current {
      background: yellow;
    }
  </style>
</head>

<body>

  <div id="grid">
    <!-- <div class="node" data-start="true" data-current="true"></div> -->
    <!-- <div class="node" ></div> -->
    <!-- <div class="node"></div> -->
    <!-- <div class="node" data-destination="true"></div> -->
  </div>
  <div style="margin-top: 10px;">
    <label>Select max number of looked walls</label>
    <input type="text" id="name" name="name" required minlength="4" maxlength="8" size="10"
      style="border: 1px solid black; padding: 5px;" />
  </div>
  <div></div>

</body>


</html>
